networks:
  external_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.1
  internal_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.0.0.0/24
          gateway: 10.0.0.1

volumes:
  suricata_logs:
  elasticsearch_data:
  monkey_mongo_data:

services:
  firewall:
    build:
      context: ./firewall
      dockerfile: Dockerfile
    container_name: firewall
    hostname: firewall
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
      - SYSLOG
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.forwarding=1
      - net.ipv6.conf.all.forwarding=0
      - net.ipv4.conf.all.send_redirects=0
      - net.ipv4.conf.default.send_redirects=0
    networks:
      external_net:
      internal_net:
    volumes:
      - suricata_logs:/var/log/suricata
    depends_on:
      - logstash

  victim-1:
    build:
      context: ./victim
      dockerfile: Dockerfile
    container_name: victim-1
    hostname: victim-1
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    networks:
      internal_net:
    sysctls:
      - net.ipv4.conf.all.accept_source_route=0
    environment:
      - VICTIM_ID=1
      - SSH_PASSWORD=toor

  victim-2:
    build:
      context: ./victim
      dockerfile: Dockerfile
    container_name: victim-2
    hostname: victim-2
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    networks:
      internal_net:
    sysctls:
      - net.ipv4.conf.all.accept_source_route=0
    environment:
      - VICTIM_ID=2
      - SSH_PASSWORD=toor

  monkey_island:
    image: infectionmonkey/monkey-island:latest
    container_name: monkey_island
    hostname: monkey_island
    tty: true
    stdin_open: true
    network_mode: host
    depends_on:
      - monkey_mongo

  monkey_mongo:
    image: mongo:6.0
    container_name: monkey_mongo
    hostname: monkey_mongo
    network_mode: host
    volumes:
      - monkey_mongo_data:/data/db

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    hostname: elasticsearch
    ports:
      - "9200:9200"
    networks:
      external_net:
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: logstash
    hostname: logstash
    ports:
      - "5515:5515/udp"
      - "5044:5044"
    networks:
      external_net:
    volumes:
      - ./elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    hostname: kibana
    ports:
      - "5601:5601"
    networks:
      external_net:
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
