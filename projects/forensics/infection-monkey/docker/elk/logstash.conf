input {
  syslog {
    port => 5515
    type => "syslog"
  }
  beats {
    port => 5044
  }
}

filter {
  if [type] == "syslog" {
    grok {
      match => { "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}" }
    }
    date {
      match => [ "syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
    }
  }

  if [type] == "syslog" and [syslog_message] =~ /FW-(INPUT|FORWARD)-DROP/ {
    grok {
      match => { "syslog_message" => "FW-%{WORD:fw_chain}-DROP: IN=%{DATA:fw_in} OUT=%{DATA:fw_out} (?:MAC=%{DATA:fw_mac} )?SRC=%{IP:src_ip} DST=%{IP:dst_ip} LEN=%{NUMBER:fw_len}(?: TOS=%{DATA:fw_tos})?(?: PREC=%{DATA:fw_prec})?(?: TTL=%{NUMBER:fw_ttl})?(?: ID=%{NUMBER:fw_id})?(?: DF)?(?: PROTO=%{WORD:fw_proto})?(?: SPT=%{NUMBER:src_port})?(?: DPT=%{NUMBER:dst_port})?(?: WINDOW=%{NUMBER:fw_window})?(?: RES=%{DATA:fw_res})? %{GREEDYDATA}" }
    }
    mutate {
      add_tag => [ "firewall_drop" ]
    }
    if [dst_port] == "22" {
      mutate { add_tag => [ "ssh_attack" ] }
    }
    if [dst_port] == "445" or [dst_port] == "139" or [dst_port] == "135" {
      mutate { add_tag => [ "smb_attack" ] }
    }
    if [dst_port] == "3389" {
      mutate { add_tag => [ "rdp_attack" ] }
    }
    if [dst_port] == "3306" {
      mutate { add_tag => [ "mysql_attack" ] }
    }
  }

  if [type] == "syslog" and [syslog_message] =~ /Failed password/ {
    grok {
      match => { "syslog_message" => "Failed password for (invalid user )?%{USERNAME:ssh_user} from %{IP:src_ip} port %{NUMBER:src_port} %{GREEDYDATA}" }
    }
    mutate {
      add_tag => [ "ssh_failed_attempt", "bruteforce", "MITRE_T1110.001" ]
    }
  }

  if [type] == "syslog" and [syslog_message] =~ /Accepted password/ {
    grok {
      match => { "syslog_message" => "Accepted password for %{USERNAME:ssh_user} from %{IP:src_ip} port %{NUMBER:src_port} %{GREEDYDATA}" }
    }
    mutate {
      add_tag => [ "ssh_login_success", "MITRE_T1078" ]
    }
  }

  if [type] == "syslog" and [syslog_message] =~ /authentication failure/ {
    grok {
      match => { "syslog_message" => ".*authentication failure.*ruser=%{DATA:ruser}.*user=%{USERNAME:ssh_user}.*" }
    }
    mutate {
      add_tag => [ "ssh_auth_failure", "bruteforce" ]
    }
  }

  if [log_type] == "suricata_eve" and [event_type] == "alert" {
    json {
      source => "message"
      target => "suricata"
    }
    if [suricata][alert] {
      mutate {
        add_field => {
          "src_ip" => "%{[suricata][src_ip]}"
          "dst_ip" => "%{[suricata][dest_ip]}"
          "src_port" => "%{[suricata][src_port]}"
          "dst_port" => "%{[suricata][dest_port]}"
          "alert_signature" => "%{[suricata][alert][signature]}"
          "alert_category" => "%{[suricata][alert][category]}"
          "alert_severity" => "%{[suricata][alert][severity]}"
          "alert_sid" => "%{[suricata][alert][signature_id]}"
        }
        add_tag => [ "suricata_alert", "IDS_detection" ]
      }
    }
  }

  if [alert_signature] =~ /PROYECTO11/ {
    mutate { add_tag => [ "custom_rule_match" ] }
  }

  if [alert_category] == "Attempted Administrator Privilege Gain" {
    mutate { add_tag => [ "MITRE_T1068" ] }
  }

  if [log_type] == "suricata_eve" and [event_type] == "flow" {
    json {
      source => "message"
      target => "suricata_flow"
    }
    mutate { add_tag => [ "suricata_flow" ] }
  }

  if [log_type] == "suricata_eve" and [event_type] == "http" {
    json {
      source => "message"
      target => "suricata_http"
    }
    mutate { add_tag => [ "suricata_http_log" ] }
  }

  if [log_type] == "suricata_eve" and [event_type] == "dns" {
    json {
      source => "message"
      target => "suricata_dns"
    }
    mutate { add_tag => [ "suricata_dns_log" ] }
  }

  if [log_type] == "suricata_eve" and [event_type] == "smb" {
    json {
      source => "message"
      target => "suricata_smb"
    }
    mutate { add_tag => [ "suricata_smb_log", "lateral_movement", "MITRE_T1021.002" ] }
  }

  if [type] == "syslog" and [syslog_message] =~ /audit/ {
    mutate { add_tag => [ "auditd_event" ] }
  }

  if [src_ip] {
    geoip {
      source => "src_ip"
      target => "geoip"
    }
  }
}

output {
  if "_grokparsefailure" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "proyecto11-parse-failures-%{+YYYY.MM.dd}"
    }
  }
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "proyecto11-logs-%{+YYYY.MM.dd}"
  }
}
